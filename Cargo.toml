[package]
name = "coordination-patterns"
version = "0.1.0"
edition = "2024"
description = "Multi-agent coordination patterns — capability graphs, intent routing, consensus, and more."
license = "MIT"

[[bin]]
name = "coordination-patterns"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.34", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "test_capability_router"
path = "tests-unit/test_capability_router.rs"

[[test]]
name = "test_intent_extractor"
path = "tests-unit/test_intent_extractor.rs"

[[test]]
name = "test_llm_interface"
path = "tests-unit/test_llm_interface.rs"

[[test]]
name = "test_semantic_cache"
path = "tests-unit/test_semantic_cache.rs"

[[test]]
name = "test_semantic_cache_utils"
path = "tests-unit/test_semantic_cache_utils.rs"

[[test]]
name = "integration_tests"
path = "tests-integration/integration_tests.rs"
