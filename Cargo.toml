[package]
name = "local-agent"
version = "0.1.0"
edition = "2024"
description = "Local AI agent coordination — intent extraction, semantic caching, and agent routing."
license = "MIT"

[[bin]]
name = "local-agent"
path = "src/main.rs"

[[bin]]
name = "generate-domain-language"
path = "src/bin/generate-domain-language.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.34", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

