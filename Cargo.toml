[package]
name = "local-agent"
version = "0.1.0"
edition = "2024"
description = "Local AI agent coordination — intent extraction, semantic caching, and agent routing."
license = "MIT"

[[bin]]
name = "local-agent"
path = "src/main.rs"

[[bin]]
name = "generate-domain-language"
path = "src/bin/generate-domain-language.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.34", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "test_capability_router"
path = "tests-unit/test_capability_router.rs"

[[test]]
name = "test_intent_extractor"
path = "tests-unit/test_intent_extractor.rs"

[[test]]
name = "test_llm_interface"
path = "tests-unit/test_llm_interface.rs"

[[test]]
name = "test_semantic_cache"
path = "tests-unit/test_semantic_cache.rs"

[[test]]
name = "test_semantic_cache_utils"
path = "tests-unit/test_semantic_cache_utils.rs"

[[test]]
name = "test_semantic_cache_mock"
path = "tests-unit/test_semantic_cache_mock.rs"

[[test]]
name = "test_semantic_cache_sqlite"
path = "tests-integration/test_semantic_cache_sqlite.rs"

[[test]]
name = "test_supervisor"
path = "tests-unit/test_supervisor.rs"

[[test]]
name = "test_loan_pipeline"
path = "tests-unit/test_loan_pipeline.rs"

[[test]]
name = "test_loan_orchestrator"
path = "tests-unit/test_loan_orchestrator.rs"

[[test]]
name = "test_loan_e2e"
path = "tests-integration/test_loan_e2e.rs"

[[test]]
name = "integration_tests"
path = "tests-integration/integration_tests.rs"
